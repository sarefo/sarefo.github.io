<!DOCTYPE html>
<html>
<head>
    <title>Network Monitor</title>
    <style>
        body {
            margin: 0;
            padding: 8px;
            font-family: Arial, sans-serif;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 16px);
            overflow: hidden;
        }
        /* height:auto matters -- the base rule's calc(100vh - 16px) assumes the
           8px padding, so at compact's 4px it would leave the body shorter than
           the bar and overflow:hidden would clip it once the window shrink-wraps */
        body.compact { padding: 4px 6px; height: auto; }
        #status {
            padding: 8px;
            text-align: center;
            border-radius: 5px;
            margin-bottom: 6px;
        }
        #metrics {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .metric {
            text-align: center;
            flex: 1;
        }
        .metric div:last-child {
            font-size: 11px;
            color: #777;
        }
        .online { background-color: #c8e6c9; color: #2e7d32; }
        .offline { background-color: #ffcdd2; color: #c62828; }
        .slow { background-color: #fff9c4; color: #f57f17; }

        #portsHeader {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
            border-top: 1px solid #ddd;
            font-size: 12px;
        }
        #portsHeader b { margin-right: auto; }
        #portsHeader label {
            display: flex;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            color: #555;
        }
        button {
            border: 1px solid #ccc;
            background: #f5f5f5;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            padding: 1px 6px;
            line-height: 16px;
        }
        button:hover { background: #e0e0e0; }
        button.awake { color: #bbb; }
        button.awake.on {
            background: #fff9c4;
            border-color: #f9a825;
            color: #f57f17;
        }
        #ports {
            flex: 1;
            overflow-y: auto;
            font-size: 12px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            text-align: left;
            font-size: 11px;
            color: #777;
            font-weight: normal;
            position: sticky;
            top: 0;
            background: #fff;
            padding: 2px 4px;
            border-bottom: 1px solid #ddd;
        }
        td {
            padding: 1px 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 140px;
        }
        tr:nth-child(even) td { background: #f5f5f5; }
        tr.selectable { cursor: pointer; }
        tr.selectable:hover td { background: #e3f2fd; }
        td.pin { max-width: 16px; width: 16px; color: #ccc; }
        tr.pinned td.pin { color: #f9a825; }
        tr.pinned td { background: #fff8e1; }
        .proto { color: #999; font-size: 11px; }
        .section-label {
            font-size: 11px;
            color: #777;
            padding: 6px 0 2px;
            border-bottom: 1px solid #ddd;
        }
        #portsError { color: #c62828; font-size: 12px; padding: 4px; }
        #hint { font-size: 11px; color: #999; padding: 2px 4px; }

        /* --- compact mode: one slim bar with latency + pinned port chips --- */
        #compactBar {
            display: none;
            align-items: center;
            gap: 5px;
            flex-wrap: nowrap; /* buttons stay on the bar; only #chips wraps */
        }
        body.compact #compactBar { display: flex; }
        #chips {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-wrap: wrap;
            min-width: 0;
        }
        body.compact #status, body.compact #metrics,
        body.compact #portsHeader, body.compact #ports { display: none; }
        #compactLatency {
            font-size: 12px;
            padding: 2px 7px;
            border-radius: 10px;
            min-width: 44px;
            text-align: center;
        }
        .chip {
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 10px;
            background: #eee;
            color: #999;
            cursor: default;
        }
        .chip.open { background: #c8e6c9; color: #2e7d32; }
        .chip.stale { background: #f5f5f5; color: #bbb; border: 1px dashed #bbb; }
        #compactBar .stale-note { font-size: 11px; color: #c62828; }
        #compactBar .spacer { flex: 1; }
        #compactBar .none { font-size: 11px; color: #999; }
    </style>
</head>
<body>
    <div id="compactBar">
        <span id="compactLatency">--</span>
        <span id="chips"></span>
        <span class="spacer"></span>
        <button class="awake" id="awakeBtnCompact" title="Keep screen awake while visible">☀</button>
        <button id="expandBtn" title="Expand">⤢</button>
    </div>

    <div id="status">Checking...</div>
    <div id="metrics">
        <div class="metric">
            <div id="latency">--</div>
            <div>Latency</div>
        </div>
        <div class="metric">
            <div id="lastCheck">--</div>
            <div>Last Check</div>
        </div>
    </div>

    <div id="portsHeader">
        <b>Ports</b>
        <label><input type="checkbox" id="showSelected"> pinned</label>
        <label><input type="checkbox" id="showProcs"> proc</label>
        <label><input type="checkbox" id="showUdp"> UDP</label>
        <label><input type="checkbox" id="showConns"> active</label>
        <button class="awake" id="awakeBtn" title="Keep screen awake while visible">☀</button>
        <button id="compactBtn" title="Compact view">–</button>
    </div>
    <div id="ports"><div id="portsError" hidden></div></div>

    <script>
        const statusEl = document.getElementById('status');
        const latencyEl = document.getElementById('latency');
        const lastCheckEl = document.getElementById('lastCheck');
        const portsEl = document.getElementById('ports');
        const chipsEl = document.getElementById('chips');
        const compactLatencyEl = document.getElementById('compactLatency');
        const showSelected = document.getElementById('showSelected');
        const showProcs = document.getElementById('showProcs');
        const showUdp = document.getElementById('showUdp');
        const showConns = document.getElementById('showConns');

        // Use a small image to test connectivity with minimal bandwidth
        const testUrl = 'https://www.google.com/favicon.ico';
        const slowThreshold = 500; // ms

        // --- persisted state ---
        const pinned = new Set(JSON.parse(localStorage.getItem('netmonPinned') || '[]'));
        showSelected.checked = localStorage.getItem('netmonShowSelected') === '1';

        function savePinned() {
            localStorage.setItem('netmonPinned', JSON.stringify([...pinned].sort((a, b) => a - b)));
            localStorage.setItem('netmonShowSelected', showSelected.checked ? '1' : '0');
        }

        // --- compact mode ---
        // Fallback for switching into a mode that has never been sized. Neither
        // this nor the remembered size is applied on load -- Chrome restores the
        // window itself, and anything here would just override what you dragged.
        const DEFAULT_SIZE = { full: [340, 520], compact: [420, 72] };
        const sizeKey = on => on ? 'netmonSizeCompact' : 'netmonSizeFull';
        // Past this the chips wrap to a second row instead of growing forever.
        const COMPACT_MAX_WIDTH = () => Math.round(screen.availWidth * 0.6);

        // Measure the bar at its natural, unwrapped size. It normally stretches to
        // fill the window (the spacer is flex:1), so it has to be taken out of that
        // layout for a moment to find out how much room it actually wants.
        function naturalBarSize(bar, chips) {
            const prevWrap = chips.style.flexWrap, prevWidth = bar.style.width;
            chips.style.flexWrap = 'nowrap';
            bar.style.width = 'max-content';
            const size = [bar.scrollWidth, bar.getBoundingClientRect().height];
            chips.style.flexWrap = prevWrap;
            bar.style.width = prevWidth;
            return size;
        }

        // Shrink-wrap the window around the compact bar: just wide enough for one
        // row of elements, just tall enough for the rows it ends up using.
        function fitCompactSize() {
            if (!document.body.classList.contains('compact')) return;
            try {
                const bar = document.getElementById('compactBar');
                const chips = document.getElementById('chips');
                const cs = getComputedStyle(document.body);
                const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
                const padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
                const frameX = window.outerWidth - window.innerWidth;
                const frameY = window.outerHeight - window.innerHeight;

                const [natW] = naturalBarSize(bar, chips);
                const w = Math.min(Math.round(natW + padX + frameX), COMPACT_MAX_WIDTH());
                // measured live, so a width cap that forces chips to wrap is picked
                // up on the next pass rather than clipping them
                const h = Math.round(
                    bar.getBoundingClientRect().height + padY + frameY);

                // the guard keeps this from oscillating on every poll
                if (w > 0 && h > 0 &&
                    (Math.abs(w - window.outerWidth) > 2 ||
                     Math.abs(h - window.outerHeight) > 2)) {
                    window.resizeTo(w, h);
                }
            } catch (e) { /* resize not allowed; size just stays as-is */ }
        }

        function savedSize(on) {
            try {
                const s = JSON.parse(localStorage.getItem(sizeKey(on)));
                // a fitted compact bar is only ~50px tall, so the floor is low
                if (Array.isArray(s) && s.length === 2 &&
                    s.every(n => Number.isFinite(n) && n > 20)) return s;
            } catch (e) { /* fall through to default */ }
            return null;
        }

        // `resize` is only ever true for an explicit compact/expand toggle, where
        // changing the window size is the whole point. On load it must stay false:
        // Chrome already restores this --app window's own remembered bounds (see
        // app_window_placement in its Preferences), and resizing on top of that is
        // what reset the window on every single start.
        function setCompact(on, resize) {
            document.body.classList.toggle('compact', on);
            localStorage.setItem('netmonCompact', on ? '1' : '0');
            if (!resize) return;
            const saved = savedSize(on);
            try {
                const [w, h] = saved || DEFAULT_SIZE[on ? 'compact' : 'full'];
                window.resizeTo(w, h);
            } catch (e) { /* resize not allowed; view still collapses */ }
            if (!saved) fitCompactSize();
        }
        document.getElementById('compactBar').ondblclick = (e) => {
            // opt-in re-snug, for after pinning or unpinning ports
            if (e.target.closest('button')) return;
            fitCompactSize();
        };
        document.getElementById('compactBtn').onclick = () => setCompact(true, true);
        document.getElementById('expandBtn').onclick = () => setCompact(false, true);

        // Chrome persists this window's position and size itself, so nothing here
        // restores geometry on load. The only reason to record a size is to have
        // something sensible to switch to when the compact/expand button is used.
        function saveSize() {
            try {
                // ignore bogus dimensions while minimized/animating
                if (window.outerWidth > 20 && window.outerHeight > 20) {
                    const on = document.body.classList.contains('compact');
                    localStorage.setItem(sizeKey(on),
                        JSON.stringify([window.outerWidth, window.outerHeight]));
                }
            } catch (e) { /* ignore */ }
        }
        // adopt the saved view mode without touching the window Chrome just placed
        setCompact(localStorage.getItem('netmonCompact') === '1', false);
        setInterval(saveSize, 2000);

        // --- tell the backend we're closing so it can exit right away,
        // instead of relying on the idle-timeout safety net ---
        function notifyShutdown() {
            try { navigator.sendBeacon('/api/shutdown'); } catch (e) { /* ignore */ }
        }
        window.addEventListener('pagehide', notifyShutdown);

        // --- keep screen awake while the window is visible (like a video player) ---
        const awakeBtns = [document.getElementById('awakeBtn'),
                           document.getElementById('awakeBtnCompact')];
        let awakeEnabled = localStorage.getItem('netmonAwake') !== '0'; // default on
        let wakeLock = null;

        async function updateWakeLock() {
            if (awakeEnabled && document.visibilityState === 'visible' && !wakeLock) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    // released by the browser when the window is hidden/minimized;
                    // visibilitychange below re-acquires it
                    wakeLock.addEventListener('release', () => { wakeLock = null; });
                } catch (e) {
                    wakeLock = null;
                }
            } else if (!awakeEnabled && wakeLock) {
                wakeLock.release();
                wakeLock = null;
            }
            for (const b of awakeBtns) b.classList.toggle('on', awakeEnabled);
        }
        for (const b of awakeBtns) {
            b.onclick = () => {
                awakeEnabled = !awakeEnabled;
                localStorage.setItem('netmonAwake', awakeEnabled ? '1' : '0');
                updateWakeLock();
            };
        }
        document.addEventListener('visibilitychange', updateWakeLock);
        updateWakeLock();

        let portsData = null;
        let portsStale = false; // backend unreachable; portsData is a leftover snapshot
        let lastLatencyText = '--';
        let lastStatusClass = '';

        function esc(s) {
            return String(s).replace(/[&<>"]/g, c =>
                ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
        }

        function renderCompact() {
            compactLatencyEl.textContent = lastLatencyText;
            compactLatencyEl.className = lastStatusClass;

            // which pinned ports are currently in use, and by what
            const open = new Map();
            if (portsData) {
                for (const e of portsData.listening) {
                    if (pinned.has(e.port)) {
                        open.set(e.port, (open.get(e.port) ? open.get(e.port) + ', ' : '') + e.proc);
                    }
                }
            }
            let html = '';
            for (const port of [...pinned].sort((a, b) => a - b)) {
                const proc = open.get(port);
                const cls = portsStale ? ' stale' : (proc ? ' open' : '');
                const title = portsStale ? 'unknown — port info unavailable'
                    : (proc ? esc(proc) : 'not in use');
                html += `<span class="chip${cls}" title="${title}">${port}</span>`;
            }
            if (portsStale) {
                html += '<span class="stale-note" title="restart via netmon.bat">' +
                    '⚠ no port data</span>';
            }
            chipsEl.innerHTML = html || '<span class="none">no ports pinned</span>';
        }

        function checkConnection() {
            const startTime = Date.now();
            lastCheckEl.textContent = new Date().toLocaleTimeString();

            fetch(testUrl, {
                method: 'HEAD',
                cache: 'no-store',
                mode: 'no-cors'
            })
            .then(() => {
                const latency = Date.now() - startTime;
                lastLatencyText = latency + 'ms';
                lastStatusClass = latency > slowThreshold ? 'slow' : 'online';
                latencyEl.textContent = lastLatencyText;
                statusEl.textContent = lastStatusClass === 'slow' ? 'Slow Connection' : 'Online';
                statusEl.className = lastStatusClass;
                renderCompact();
            })
            .catch(() => {
                lastLatencyText = '--';
                lastStatusClass = 'offline';
                statusEl.textContent = 'Offline';
                statusEl.className = 'offline';
                latencyEl.textContent = '--';
                renderCompact();
            });
        }

        function togglePin(port) {
            pinned.has(port) ? pinned.delete(port) : pinned.add(port);
            savePinned();
            renderPorts();
            renderCompact();
        }

        function renderPorts() {
            if (!portsData) return;
            const procs = showProcs.checked;
            let listening = portsData.listening.filter(
                e => showUdp.checked || e.proto === 'TCP');
            if (showSelected.checked) {
                listening = listening.filter(e => pinned.has(e.port));
            }

            let html = '<table><tr><th></th><th>Port</th><th></th>' +
                (procs ? '<th>Process</th>' : '') + '</tr>';
            for (const e of listening) {
                const isPinned = pinned.has(e.port);
                html += `<tr class="selectable${isPinned ? ' pinned' : ''}" data-port="${e.port}">` +
                    `<td class="pin">★</td>` +
                    `<td>${e.port}</td><td class="proto">${e.proto}</td>` +
                    (procs ? `<td title="PID ${e.pid}">${esc(e.proc)}</td>` : '') +
                    '</tr>';
            }
            html += '</table>';
            html += '<div id="hint">click a row to pin/unpin a port</div>';

            if (showConns.checked) {
                html += '<div class="section-label">Active connections</div>';
                html += '<table><tr><th>Port</th><th>Remote</th>' +
                    (procs ? '<th>Process</th>' : '') + '</tr>';
                for (const e of portsData.established) {
                    html += `<tr><td>${e.port}</td><td title="${esc(e.remote)}">${esc(e.remote)}</td>` +
                        (procs ? `<td title="PID ${e.pid}">${esc(e.proc)}</td>` : '') +
                        '</tr>';
                }
                html += '</table>';
            }
            portsEl.innerHTML = html;

            for (const row of portsEl.querySelectorAll('tr.selectable')) {
                row.onclick = () => togglePin(Number(row.dataset.port));
            }
        }

        function fetchPorts() {
            fetch('/api/ports', { cache: 'no-store' })
            .then(r => r.json())
            .then(data => {
                portsData = data;
                portsStale = false;
                renderPorts();
                renderCompact();
            })
            .catch(() => {
                portsStale = true;
                portsEl.innerHTML = '<div id="portsError">Port info unavailable ' +
                    '(open via netmon.bat so the local server is running)</div>';
                renderCompact();
            });
        }

        showProcs.onchange = showUdp.onchange = showConns.onchange = renderPorts;
        showSelected.onchange = () => { savePinned(); renderPorts(); };

        // Check initially and then every 5 seconds
        checkConnection();
        fetchPorts();
        renderCompact();
        setInterval(checkConnection, 5000);
        setInterval(fetchPorts, 5000);
        setInterval(updateWakeLock, 30000); // safety net if the lock gets dropped
    </script>
</body>
</html>
