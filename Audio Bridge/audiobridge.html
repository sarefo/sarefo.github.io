<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Audio Bridge</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --text: #1d2129; --dim: #6b7280;
    --line: #e2e5ea; --accent: #2563eb; --ok: #16a34a; --bad: #dc2626;
  }
  [data-theme="dark"] {
    --bg: #14161a; --panel: #1d2025; --text: #e5e7eb; --dim: #9ca3af;
    --line: #2e3238; --accent: #60a5fa; --ok: #4ade80; --bad: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 10px; background: var(--bg); color: var(--text);
    font: 13px/1.45 "Segoe UI", system-ui, sans-serif;
  }
  h1 {
    font-size: 14px; margin: 0 0 8px; display: flex;
    align-items: center; gap: 8px;
  }
  h1 .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); }
  h1 .dot.running { background: var(--ok); }
  h1 .dot.error { background: var(--bad); }
  h1 button {
    margin-left: auto; font-size: 15px; line-height: 1; padding: 2px 7px;
    background: none; border: 1px solid var(--line); border-radius: 5px;
    color: var(--dim); cursor: pointer;
  }
  section {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; margin-bottom: 8px;
  }
  .label { color: var(--dim); font-size: 11px; text-transform: uppercase;
           letter-spacing: .05em; margin-bottom: 4px; }
  select {
    width: 100%; padding: 4px 6px; background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 5px; font: inherit;
  }
  table { width: 100%; border-collapse: collapse; }
  td, th { padding: 3px 6px 3px 0; text-align: left; font-weight: normal; }
  th { color: var(--dim); font-size: 11px; }
  td.num { font-variant-numeric: tabular-nums; }
  .drop-bad { color: var(--bad); }
  .empty { color: var(--dim); font-style: italic; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row button {
    font: inherit; font-size: 12px; padding: 2px 9px; cursor: pointer;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 5px;
  }
  .adb-ok { color: var(--ok); }
  .adb-bad { color: var(--bad); }
  #hint { color: var(--dim); font-size: 11.5px; margin-top: 2px; }
</style>
</head>
<body>
<h1><span class="dot" id="dot"></span><span id="state">connecting…</span>
    <button id="theme" title="Toggle theme">◐</button></h1>

<section>
  <div class="label">Capture device (pick your silent virtual output)</div>
  <select id="device"></select>
  <div id="hint"></div>
</section>

<section>
  <div class="row" style="justify-content:space-between">
    <div class="label" style="margin:0">USB devices (adb)</div>
    <button id="reapply">re-apply reverse</button>
  </div>
  <div id="adb" style="margin-top:4px"></div>
</section>

<section>
  <div class="label">Connected players</div>
  <div id="clients"></div>
</section>

<script>
const $ = id => document.getElementById(id);

// theme: manual toggle persisted, else follow OS
const savedTheme = localStorage.getItem("ab-theme");
if (savedTheme) document.documentElement.dataset.theme = savedTheme;
else if (matchMedia("(prefers-color-scheme: dark)").matches)
  document.documentElement.dataset.theme = "dark";
$("theme").onclick = () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  localStorage.setItem("ab-theme", next);
};

let devicesKey = "";

async function poll() {
  let s;
  try {
    s = await (await fetch("/api/status")).json();
  } catch {
    $("dot").className = "dot error";
    $("state").textContent = "server unreachable";
    return;
  }

  const cap = s.capture;
  $("dot").className = "dot " + (cap === "running" ? "running"
                       : cap.startsWith("error") ? "error" : "");
  $("state").textContent = cap === "running"
    ? `streaming · ${s.clients.length} player${s.clients.length === 1 ? "" : "s"}`
    : cap === "idle" ? "idle — waiting for players" : cap;

  // device dropdown (rebuild only when the list changes, to not fight the user)
  const key = JSON.stringify([s.devices, s.device]);
  if (key !== devicesKey) {
    devicesKey = key;
    const sel = $("device");
    sel.innerHTML = "";
    for (const name of s.devices) {
      const o = document.createElement("option");
      o.textContent = o.value = name;
      if (name === s.device) o.selected = true;
      sel.appendChild(o);
    }
    if (s.device === "(default output)") {
      for (const o of sel.options)
        if (o.value === s.default_output) o.selected = true;
    }
  }
  $("hint").textContent = "Windows default output: " + s.default_output;

  // adb devices
  const serials = Object.entries(s.adb);
  $("adb").innerHTML = serials.length
    ? serials.map(([ser, st]) =>
        `<div>${ser} — <span class="${st === "ok" ? "adb-ok" : "adb-bad"}">` +
        `${st === "ok" ? "tunnel on port " + s.audio_port : st}</span></div>`).join("")
    : '<div class="empty">no USB-debugging device attached</div>';

  // clients
  $("clients").innerHTML = s.clients.length
    ? "<table><tr><th>from</th><th>up</th><th>sent</th><th>drops</th><th>queue</th></tr>" +
      s.clients.map(c =>
        `<tr><td>${c.addr}</td><td class="num">${fmtDur(c.since)}</td>` +
        `<td class="num">${c.sent}</td>` +
        `<td class="num ${c.dropped ? "drop-bad" : ""}">${c.dropped}</td>` +
        `<td class="num">${c.queued}</td></tr>`).join("") + "</table>"
    : '<div class="empty">none — open the app on the phone and tap Connect</div>';
}

function fmtDur(sec) {
  return sec < 60 ? sec + "s" : Math.floor(sec / 60) + "m" + (sec % 60) + "s";
}

$("device").onchange = () =>
  fetch("/api/device", { method: "POST",
    body: JSON.stringify({ device: $("device").value }) });

$("reapply").onclick = () => fetch("/api/reverse", { method: "POST" });

// Same close-beacon contract as netmon: the server only *schedules* an exit.
addEventListener("pagehide", () =>
  navigator.sendBeacon && navigator.sendBeacon("/api/shutdown"));

poll();
setInterval(poll, 2000);
</script>
</body>
</html>
