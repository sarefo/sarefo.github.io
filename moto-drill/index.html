<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moto Theory Drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800;900&family=Overpass+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-column phone app. Home = readiness + topic list; Drill = one card at a time with thumb-reach answers. Type is Overpass (a Highway Gothic descendant) to echo road signage. */
:root {
  --bg: #eef0f2;          /* concrete */
  --surface: #ffffff;
  --ink: #1b1f24;          /* asphalt */
  --muted: #5b6470;
  --line: #d5d9de;
  --accent: #b88a00;       /* lane-marking yellow, darkened for text on light */
  --accent-fill: #f2c200;
  --accent-ink: #1b1f24;
  --good: #0b7a3e;         /* guide-sign green */
  --good-bg: #e3f3e9;
  --bad: #c8102e;          /* regulatory red */
  --bad-bg: #fbe5e8;
  --plate: #ffffff;        /* backing for sign images */
  --display: "Overpass", "Arial Narrow", system-ui, sans-serif;
  --body: "Overpass", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Overpass Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15181c; --surface: #1f242a; --ink: #eceff2; --muted: #9aa4b0; --line: #2f363e;
    --accent: #f2c200; --accent-fill: #f2c200; --accent-ink: #15181c;
    --good: #4cc47f; --good-bg: #173324; --bad: #ff6b7d; --bad-bg: #3a1a20; --plate: #f4f5f6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15181c; --surface: #1f242a; --ink: #eceff2; --muted: #9aa4b0; --line: #2f363e;
  --accent: #f2c200; --accent-fill: #f2c200; --accent-ink: #15181c;
  --good: #4cc47f; --good-bg: #173324; --bad: #ff6b7d; --bad-bg: #3a1a20; --plate: #f4f5f6;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.45 var(--body); }
.wrap { max-width: 34rem; margin: 0 auto; padding-inline: 16px; padding-block: 12px 40px; display: flex; flex-direction: column; gap: 18px; }
h1, h2 { font-family: var(--display); text-wrap: balance; margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, .topic:focus-visible { outline: 3px solid var(--accent-fill); outline-offset: 2px; }
.label { font: 700 0.72rem/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

/* Header: road-stripe band */
.masthead { display: flex; flex-direction: column; gap: 6px; padding-top: 6px; }
.masthead h1 { font-weight: 900; font-size: 2rem; line-height: 1; letter-spacing: -0.01em; }
.masthead p { margin: 0; color: var(--muted); font-size: 0.95rem; }
.stripe { height: 6px; background: repeating-linear-gradient(90deg, var(--accent-fill) 0 28px, transparent 28px 44px); border-radius: 1px; }

/* Readiness gauge */
.ready { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.dial { width: 84px; height: 84px; }
.dial text { font-family: var(--mono); font-weight: 700; fill: var(--ink); }
.ready-copy { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.ready-copy strong { font-family: var(--display); font-size: 1.15rem; }
.ready-copy span { color: var(--muted); font-size: 0.9rem; }

/* Primary actions */
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { border: 0; border-radius: 12px; padding: 14px 12px; font-weight: 800; font-family: var(--display); font-size: 1.02rem; text-align: left; display: flex; flex-direction: column; gap: 2px; min-height: 64px; }
.btn small { font: 600 0.78rem/1.2 var(--body); opacity: 0.8; }
.btn-main { grid-column: 1 / -1; background: var(--accent-fill); color: var(--accent-ink); }
.btn-alt { background: var(--surface); border: 1px solid var(--line); }

/* Topic list */
.topics { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.topic { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 12px 14px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; }
.topic:first-child { border-top: 0; }
.topic-name { font-weight: 600; min-width: 0; }
.topic-count { font: 500 0.8rem var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { grid-column: 1 / -1; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .m { background: var(--good); }
.bar .l { background: var(--accent-fill); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 0.8rem; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; background: var(--c); }

/* Drill */
.drill-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); padding-block: 8px; z-index: 2; }
.back { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; font-weight: 600; }
.pips { font: 700 0.85rem var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent-fill); transition: width 0.25s; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px 16px; display: flex; flex-direction: column; gap: 14px; }
.card h2 { font-weight: 800; font-size: 1.25rem; line-height: 1.25; }
.plate { align-self: center; background: var(--plate); border-radius: 12px; padding: 14px; display: grid; place-items: center; }
.plate img { max-width: 100%; width: 170px; height: 150px; object-fit: contain; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: grid; grid-template-columns: 1.7rem 1fr; gap: 10px; align-items: start; text-align: left; border: 1.5px solid var(--line); background: var(--bg); border-radius: 12px; padding: 12px; font-size: 1rem; min-height: 52px; }
.opt b { font: 700 0.9rem/1.6 var(--mono); color: var(--muted); }
.opt span { min-width: 0; }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-bg); }
.opt.right b { color: var(--good); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.wrong b { color: var(--bad); }
.opt.picked:not(.right):not(.wrong) { border-color: var(--accent); }
.why { border-left: 4px solid var(--c, var(--good)); padding: 2px 0 2px 12px; display: flex; flex-direction: column; gap: 4px; }
.why strong { color: var(--c, var(--good)); font-family: var(--display); }
.why p { margin: 0; }
.why .src { font: 500 0.78rem var(--mono); color: var(--muted); }
/* Fixed thumb-zone bar: Next always sits in the same place */
.wrap.drilling { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
.nextbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--bg); border-top: 1px solid var(--line);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
.nextbar-in { max-width: 34rem; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.next { flex: 1; border: 0; border-radius: 12px; background: var(--ink); color: var(--bg); padding: 15px; font-weight: 800; font-family: var(--display); font-size: 1.05rem; min-height: 54px; }
.next:disabled { background: var(--line); color: var(--muted); cursor: default; }
.hint { font: 500 0.72rem/1.3 var(--mono); color: var(--muted); max-width: 9.5rem; }
@media (hover: none) { .hint .kb { display: none; } }
@media (hover: hover) { .hint .touch { display: none; } }
.card.slide { animation: slide 0.18s ease-out; }
@keyframes slide { from { transform: translateX(24px); opacity: 0.4; } to { transform: none; opacity: 1; } }

/* Result */
.score { font: 900 3.4rem/1 var(--display); font-variant-numeric: tabular-nums; }
.verdict { font-family: var(--display); font-weight: 800; font-size: 1.2rem; }
.verdict.pass { color: var(--good); }
.verdict.fail { color: var(--bad); }
.review { display: flex; flex-direction: column; gap: 10px; }
.miss { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 4px; }
.miss img { width: 72px; height: 64px; object-fit: contain; background: var(--plate); border-radius: 6px; padding: 4px; }
.miss .q { font-weight: 600; }
.miss .a { color: var(--good); }
.miss .y { color: var(--bad); font-size: 0.9rem; }
.foot { color: var(--muted); font-size: 0.82rem; }
.linkish { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 0; font-size: 0.82rem; }
@media (prefers-reduced-motion: reduce) { .progress i { transition: none; } .card.slide { animation: none; } }
</style>
</head>

const QUESTIONS = [

  ["license", "What is the minimum age for a student-driver's permit?", "16", ["15", "17", "18"], "Applicants under 18 also need a parent's or guardian's consent.", "FDM p.15"],
  ["license", "What is the minimum age for a non-professional driver's license?", "17", ["16", "18", "21"], "A 17-year-old applicant needs a parent's or guardian's consent.", "FDM p.19"],

  ["license", "Which course certificate do you need to get a student permit?", "15-hour Theoretical Driving Course (TDC)", ["8-hour Practical Driving Course (PDC)", "Basic first aid seminar", "Defensive driving refresher"], "The TDC is what you are doing now on DriveTech. The PDC comes later, before the license.", "FDM p.15"],
  ["license", "Which DL code covers ordinary motorcycles (L1, L2, L3)?", "A", ["A1", "B", "B1"], "A1 covers tricycles and small three- and four-wheelers (L4 to L7).", "FDM p.11"],
  ["license", "Which DL code covers tricycles (L4 to L7)?", "A1", ["A", "B", "C"], "Code A is for two-wheeled and small three-wheeled motorcycles.", "FDM p.11"],
  ["license", "You want to ride both manual and automatic motorcycles. Which clutch code should your license show?", "MT (manual transmission)", ["AT (automatic transmission)", "Either one, they are equivalent", "Both codes must be listed separately"], "An MT license also lets you drive automatics. An AT license does not allow manuals, so take your practical test on a manual bike.", "FDM p.11"],
  ["license", "A license holder with clutch code AT may drive:", "Automatic vehicles only", ["Manual and automatic vehicles", "Manual vehicles only", "Any vehicle below 400 cc"], "Only an MT code covers both.", "FDM p.11"],
  ["license", "For a first license, you may apply for:", "A non-professional license only", ["A professional license directly", "Either license, your choice", "A professional license if you are over 21"], "New applicants start with a non-professional DL under codes A, A1, B, B1 or B2.", "FDM p.11"],
  ["license", "How long must you hold a non-professional license with code A before applying for a professional license with code A?", "6 months", ["1 month", "1 year", "2 years"], "For car codes (B, B1, B2) it is 1 year. You must also be at least 18.", "FDM p.28"],
  ["license", "How long is a new driver's license valid?", "5 years, counted from your birthday", ["3 years", "10 years from issue", "Until age 60"], "It can be 10 years if you had no traffic violations.", "RA 10930"],
  ["license", "Who can get a 10-year license on renewal?", "Drivers with no traffic violations during the previous license period", ["Anyone over 30", "Professional drivers only", "Drivers who pay a higher fee"], "Everyone else gets 5 years.", "RA 10930"],
  ["license", "What happens if you're caught using a fixer or cheating on the license exam?", "₱20,000 fine, license revoked, 2-year ban on applying", ["₱1,000 fine only", "Retake the exam next day", "Warning on first offense"], "A repeat offense means a lifetime ban.", "RA 10930"],
  ["license", "Which documents should you always carry when riding your own motorcycle?", "Driver's license and the vehicle's OR/CR", ["Birth certificate", "TDC certificate", "Barangay clearance"], "OR/CR = Official Receipt and Certificate of Registration.", "FDM p.41"],

  // ---- Laws by name ----
  ["laws", "What is RA 4136?", "Land Transportation and Traffic Code", ["Motorcycle Helmet Act", "Anti-Distracted Driving Act", "Clean Air Act"], "The base law from 1964 that covers registration, licensing and traffic rules.", "RA 4136"],
  ["laws", "What is RA 10054?", "Motorcycle Helmet Act of 2009", ["Seat Belts Use Act", "Children's Safety on Motorcycles Act", "Motorcycle Crime Prevention Act"], "Requires riders and backriders to wear a standard helmet.", "RA 10054"],
  ["laws", "What is RA 10586?", "Anti-Drunk and Drugged Driving Act of 2013", ["Anti-Distracted Driving Act", "Road Speed Limiter Act", "Land Transportation and Traffic Code"], "", "RA 10586"],
  ["laws", "What is RA 10913?", "Anti-Distracted Driving Act", ["Anti-Drunk and Drugged Driving Act", "Motorcycle Helmet Act", "Child Safety in Motor Vehicles Act"], "", "RA 10913"],
  ["laws", "What is RA 10666?", "Children's Safety on Motorcycles Act of 2015", ["Motorcycle Helmet Act", "Child Safety in Motor Vehicles Act", "Motorcycle Crime Prevention Act"], "Sets when a child may ride on a motorcycle.", "RA 10666"],
  ["laws", "What is RA 11235?", "Motorcycle Crime Prevention Act", ["Motorcycle Helmet Act", "Children's Safety on Motorcycles Act", "Anti-Carnapping Act"], "Bigger, readable, color-coded plates for motorcycles.", "RA 11235"],
  ["laws", "What is RA 10930 about?", "Driver's license validity and penalties for license fraud", ["Helmet standards", "Speed limiters", "Vehicle emissions"], "It amended Sec. 23 of RA 4136.", "RA 10930"],
  ["laws", "Which law penalizes using a handheld phone while driving?", "RA 10913", ["RA 10054", "RA 10586", "RA 4136"], "", "RA 10913"],
  ["laws", "Which law requires motorcycle riders to wear standard helmets?", "RA 10054", ["RA 10666", "RA 8750", "RA 11235"], "", "RA 10054"],
  ["laws", "Which law requires bigger, readable number plates on motorcycles?", "RA 11235", ["RA 10054", "RA 4136", "RA 10930"], "", "RA 11235"],
  ["laws", "Which rules set the fines for most everyday traffic violations?", "JAO 2014-01", ["RA 10054", "The Revised Penal Code", "Local barangay ordinances"], "JAO = Joint Administrative Order. It is part of the TDC syllabus.", "FDM p.44"],

  // ---- Helmet, gear, backride, children ----
  ["gear", "Who must wear a standard protective helmet on a motorcycle?", "Both the rider and the backrider", ["Only the rider", "Only on highways", "Only above 40 km/h"], "", "RA 10054, FDM p.159"],
  ["gear", "How can you tell a helmet meets the standard?", "It has a PS mark or an ICC sticker", ["It is full-face", "It is black", "It has a visor"], "Substandard helmets without the mark are illegal to sell or use.", "RA 10054"],
  ["gear", "Fine for riding without a standard helmet, first offense?", "₱1,500", ["₱500", "₱3,000", "₱5,000"], "Then ₱3,000, ₱5,000, and ₱10,000 plus license confiscation.", "RA 10054"],

  ["gear", "On busy roads or roads with a limit above 60 km/h, a child may ride on your motorcycle only if the child:", "Reaches the foot pegs, can hold your waist, and wears a standard helmet", ["Is at least 7 years old", "Sits in front of the rider", "Is holding on to the grab rail"], "All three conditions must be met. Exception: a child who needs urgent medical care.", "RA 10666"],

  ["gear", "Saddle bags on a motorcycle must:", "Not be higher than the seat, and not stick out more than 14 inches to the side", ["Be at least 2 ft wide", "Be removed on expressways", "Be red for visibility"], "They also must not extend past the tail light.", "FDM p.159"],

  ["alcohol", "What blood alcohol level counts as drunk for a motorcycle rider?", "Anything above 0.0%", ["0.05% or more", "0.08% or more", "0.10% or more"], "Zero tolerance applies to motorcycles, trucks, buses and public utility vehicles.", "RA 10586 IRR"],
  ["alcohol", "BAC limit for a private car under 4,500 kg?", "Below 0.05%", ["0.0%", "0.08%", "0.10%"], "As a motorcycle rider, your limit is 0.0%.", "RA 10586 IRR"],
  ["alcohol", "Drunk driving with no injury or death. The penalty is:", "3 months in jail and a ₱20,000 to ₱80,000 fine", ["₱5,000 fine only", "License suspended for 1 week", "Community service only"], "", "RA 10586 Sec. 12"],

  ["alcohol", "Drunk driving that causes a death. The fine is:", "₱300,000 to ₱500,000, plus the penalty for homicide", ["₱100,000", "₱200,000", "₱1,000,000"], "", "RA 10586 Sec. 12"],
  ["alcohol", "First drunk-driving conviction with a non-professional license:", "License suspended for 12 months", ["License revoked for life", "Warning only", "License suspended for 1 month"], "A second conviction revokes it for good. A professional license is revoked on the first conviction.", "RA 10586 Sec. 12"],

const TOPICS = {
  signs: "Road signs", markings: "Markings & traffic lights", row: "Right of way",
  overtake: "Overtaking & lanes", turning: "Turning & hand signals", parking: "Parking",
  speed: "Speed limits", gear: "Helmets, gear & backriders", alcohol: "Drunk & drugged driving",
  phone: "Distracted driving", moto: "Motorcycle plates & rules", expressway: "Expressways",
  defensive: "Defensive riding", emergency: "Emergencies", fines: "Fines & penalties", license: "Licensing", laws: "Laws by name",
};
const STORE_KEY = "moto-drill-v1";
const MOCK_LEN = 25, MOCK_PASS = 0.8;

// ---- Build items ----
const items = [];
QUESTIONS.forEach((q, i) => items.push({ id: "q" + i, topic: q[0], q: q[1], a: q[2], wrong: q[3], why: q[4], src: q[5] }));
const byGroup = {};
SIGNS.forEach(s => (byGroup[s.group] ||= []).push(s));
SIGNS.forEach(s => {
  let pool = byGroup[s.group].filter(o => o !== s).map(o => o.answer);
  if (pool.length < 3) pool = pool.concat(SIGNS.filter(o => o.group !== s.group).map(o => o.answer));
  items.push({ id: s.id, topic: "signs", q: "What does this sign mean?", img: s.img, a: s.answer, pool, why: s.note, src: "FDM p." + s.page });
});

// ---- Progress store (Leitner boxes 0..5) ----
let store = {};
try { store = JSON.parse(localStorage.getItem(STORE_KEY) || "{}") || {}; } catch (e) { store = {}; }
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) {} }
const boxOf = id => (store[id] ? store[id].b : -1);   // -1 = never seen
function record(id, ok) {
  const r = store[id] || { b: 0, n: 0 };
  r.b = ok ? Math.min(5, r.b + 1) : 0;
  r.n++; r.t = Date.now();
  store[id] = r; save();
}
const MASTER = 3;
function stats(list) {
  let m = 0, l = 0;
  list.forEach(it => { const b = boxOf(it.id); if (b >= MASTER) m++; else if (b >= 0) l++; });
  return { m, l, n: list.length };
}

// ---- Helpers ----
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function optionsFor(it) {
  const wrong = it.wrong ? it.wrong : shuffle(it.pool).slice(0, 3);
  return shuffle([it.a, ...wrong]);
}
// Weakest first: unseen and box 0 first, then low boxes; random within a box.
function pickSmart(list, n) {
  return shuffle(list).map(it => ({ it, k: (boxOf(it.id) < 0 ? 0.5 : boxOf(it.id)) + Math.random() * 0.9 }))
    .sort((x, y) => x.k - y.k).slice(0, n).map(x => x.it);
}
function pickMock() {
  // Weighted like the real exams: signs are the largest block.
  const signs = shuffle(items.filter(i => i.topic === "signs")).slice(0, 8);
  const rest = shuffle(items.filter(i => i.topic !== "signs")).slice(0, MOCK_LEN - signs.length);
  return shuffle(signs.concat(rest));
}

// ---- Views ----
const app = document.getElementById("app");
let session = null;
let autoTimer = null;

function home() {
  clearTimeout(autoTimer);
  session = null;
  app.classList.remove("drilling");
  const all = stats(items);
  const pct = Math.round((all.m / all.n) * 100);
  const r = 34, c = 2 * Math.PI * r;
  const topicRows = Object.entries(TOPICS).map(([k, name]) => {
    const list = items.filter(i => i.topic === k);
    const s = stats(list);
    return `<button class="topic" data-topic="${k}">
      <span class="topic-name">${esc(name)}</span>
      <span class="topic-count">${s.m}/${s.n}</span>
      <span class="bar" aria-hidden="true"><i class="m" style="width:${(s.m / s.n) * 100}%"></i><i class="l" style="width:${(s.l / s.n) * 100}%"></i></span>
    </button>`;
  }).join("");
  const readyMsg = pct >= 85 ? "You look ready. Take a mock exam to confirm."
    : pct >= 50 ? "Good progress. Keep drilling your weakest topics."
    : all.m + all.l === 0 ? "Start with a smart drill. It serves your weakest questions first."
    : "Keep going. A question counts as mastered after 3 correct answers in a row.";
  app.innerHTML = `
    <header class="masthead">
      <span class="label">LTO · DL code A · Motorcycle</span>
      <h1>Moto Theory Drill</h1>
      <p>${items.length} questions from the Filipino Driver's Manual and the traffic laws, including ${SIGNS.length} road signs.</p>
      <div class="stripe" aria-hidden="true"></div>
    </header>
    <section class="ready" aria-label="Readiness">
      <svg class="dial" viewBox="0 0 84 84" role="img" aria-label="${pct}% mastered">
        <circle cx="42" cy="42" r="${r}" fill="none" stroke="var(--line)" stroke-width="9"/>
        <circle cx="42" cy="42" r="${r}" fill="none" stroke="var(--good)" stroke-width="9" stroke-linecap="round"
          stroke-dasharray="${(pct / 100) * c} ${c}" transform="rotate(-90 42 42)"/>
        <text x="42" y="48" text-anchor="middle" font-size="18">${pct}%</text>
      </svg>
      <div class="ready-copy">
        <strong>${all.m} of ${all.n} mastered</strong>
        <span>${readyMsg}</span>
      </div>
    </section>
    <section class="actions">
      <button class="btn btn-main" id="smart">Smart drill<small>15 questions, weakest first, all topics</small></button>
      <button class="btn btn-alt" id="mock">Mock exam<small>${MOCK_LEN} questions, pass at ${Math.round(MOCK_PASS * 100)}%</small></button>
      <button class="btn btn-alt" id="signs">Signs only<small>15 signs, weakest first</small></button>
    </section>
    <section style="display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap">
        <span class="label">Topics · tap to drill one</span>
        <span class="legend"><span style="--c:var(--good)">Mastered</span><span style="--c:var(--accent-fill)">Learning</span></span>
      </div>
      <div class="topics">${topicRows}</div>
    </section>

    <p class="foot">Progress is saved in this browser only. Sources: FDM = Filipino Driver's Manual Vol. 1, 2nd ed. (PDF page); RA = the law itself.
      <button class="linkish" id="reset">Reset progress</button></p>`;
  app.querySelector("#smart").onclick = () => start("Smart drill", pickSmart(items, 15), false);
  app.querySelector("#signs").onclick = () => start("Signs", pickSmart(items.filter(i => i.topic === "signs"), 15), false);
  app.querySelector("#mock").onclick = () => start("Mock exam", pickMock(), true);
  app.querySelectorAll(".topic").forEach(b => b.onclick = () => {
    const k = b.dataset.topic;
    start(TOPICS[k], pickSmart(items.filter(i => i.topic === k), 12), false);
  });
  const reset = app.querySelector("#reset");
  reset.onclick = () => {
    if (reset.dataset.armed) { store = {}; save(); home(); return; }
    reset.dataset.armed = "1"; reset.textContent = "Tap again to erase all progress";
  };
}

// Back swipe/button inside a drill returns to the menu instead of leaving the page.
function goHome() { if (history.state?.drill) history.back(); else home(); }
window.addEventListener("popstate", () => { if (session) home(); });

function start(title, list, exam) {
  session = { title, list: list.map(it => ({ it, opts: optionsFor(it) })), i: 0, exam, answers: [] };
  if (!history.state?.drill) history.pushState({ drill: 1 }, "");
  card();
  window.scrollTo(0, 0);
}

function card() {
  clearTimeout(autoTimer);
  const s = session, cur = s.list[s.i], it = cur.it;
  const letters = "ABCD";
  s.answered = false;
  app.classList.add("drilling");
  app.innerHTML = `
    <div class="drill-top">
      <button class="back" id="quit">← Home</button>
      <span class="label">${esc(s.title)}</span>
      <span class="pips">${s.i + 1}/${s.list.length}</span>
    </div>
    <div class="progress" aria-hidden="true"><i style="width:${(s.i / s.list.length) * 100}%"></i></div>
    <article class="card${s.i ? " slide" : ""}">
      <span class="label">${esc(TOPICS[it.topic])}</span>
      ${it.img ? `<div class="plate"><img src="${it.img}" alt="Road sign"></div>` : ""}
      <h2>${esc(it.q)}</h2>
      <div class="opts">${cur.opts.map((o, k) => `<button class="opt" data-k="${k}"><b>${letters[k]}</b><span>${esc(o)}</span></button>`).join("")}</div>
      <div id="after"></div>
    </article>
    ${s.exam ? "" : `<div class="nextbar"><div class="nextbar-in">
      <button class="next" id="next" disabled>Pick an answer</button>
      <span class="hint"><span class="kb">Keys 1–4 answer · ← or Enter next</span><span class="touch">Swipe left for next</span></span>
    </div></div>`}`;
  app.querySelector("#quit").onclick = goHome;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.k));
  const next = app.querySelector("#next");
  if (next) next.onclick = advance;
}

function advance() {
  const s = session;
  if (!s || !s.answered || !app.querySelector(".opt")) return;
  clearTimeout(autoTimer);
  if (s.i === s.list.length - 1) { result(); return; }
  s.i++; card(); window.scrollTo(0, 0);
}

function answer(k) {
  const s = session, cur = s.list[s.i], it = cur.it;
  if (s.answered) return;
  s.answered = true;
  const picked = cur.opts[k], ok = picked === it.a;
  s.answers.push({ it, picked, ok });
  record(it.id, ok);
  const btns = app.querySelectorAll(".opt");
  btns.forEach(b => b.disabled = true);
  const last = s.i === s.list.length - 1;
  if (s.exam) {
    btns[k].classList.add("picked");
    autoTimer = setTimeout(advance, 220);
    return;
  }
  btns.forEach((b, j) => { if (cur.opts[j] === it.a) b.classList.add("right"); });
  if (!ok) btns[k].classList.add("wrong");
  const after = app.querySelector("#after");
  after.innerHTML = `
    <div class="why" style="--c:${ok ? "var(--good)" : "var(--bad)"}">
      <strong>${ok ? "Correct" : "Not quite. Answer: " + esc(it.a)}</strong>
      ${it.why ? `<p>${esc(it.why)}</p>` : ""}
      <span class="src">${esc(it.src)}</span>
    </div>`;
  const next = app.querySelector("#next");
  next.disabled = false;
  next.textContent = last ? "See results" : "Next question";
  next.focus({ preventScroll: true });
  // Keep the explanation in view above the fixed bar.
  after.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

// Keyboard: 1-4 or A-D answer; Left/Right arrow, Enter or Space go to the next question.
document.addEventListener("keydown", e => {
  if (!session || e.metaKey || e.ctrlKey || e.altKey) return;
  const onResult = !app.querySelector(".opt");
  if (onResult) { if (e.key === "Enter") app.querySelector("#again")?.click(); return; }
  const k = "1234".indexOf(e.key) >= 0 ? "1234".indexOf(e.key) : "abcd".indexOf(e.key.toLowerCase());
  if (e.key.length === 1 && k >= 0 && !session.answered) { e.preventDefault(); answer(k); return; }
  if (["ArrowLeft", "ArrowRight", "Enter", " "].includes(e.key) && session.answered) { e.preventDefault(); advance(); }
  if (e.key === "Escape") goHome();
});

// Touch: swipe left anywhere on the question to go to the next one.
let touch = null;
document.addEventListener("touchstart", e => {
  const t = e.touches[0];
  touch = e.touches.length === 1 ? { x: t.clientX, y: t.clientY } : null;
}, { passive: true });
document.addEventListener("touchend", e => {
  if (!touch || !session) return;
  const t = e.changedTouches[0], dx = t.clientX - touch.x, dy = t.clientY - touch.y;
  touch = null;
  if (dx < -60 && Math.abs(dy) < Math.abs(dx) * 0.6) advance();
}, { passive: true });

function result() {
  clearTimeout(autoTimer);
  app.classList.remove("drilling");
  const s = session;
  const right = s.answers.filter(a => a.ok).length, n = s.answers.length;
  const pct = Math.round((right / n) * 100);
  const passed = right / n >= MOCK_PASS;
  const misses = s.answers.filter(a => !a.ok);
  app.innerHTML = `
    <div class="drill-top"><button class="back" id="quit">← Home</button><span class="label">${esc(s.title)}</span><span></span></div>
    <section class="card">
      <span class="label">Result</span>
      <div class="score">${right}/${n}</div>
      <div class="verdict ${passed ? "pass" : "fail"}">${pct}% · ${passed ? "Pass" : "Below the 80% pass mark"}</div>
      ${s.exam ? `<p class="foot">The student-permit and TDC exams reportedly need 80%; the non-pro license exam 75%. Ask DriveTech for the exact figure for their final exam.</p>` : ""}
      <div class="actions">
        <button class="btn btn-main" id="again">${misses.length ? "Drill the ones I missed" : "Another round"}<small>${misses.length ? misses.length + " questions" : "15 new questions, weakest first"}</small></button>
      </div>
    </section>
    ${misses.length ? `<section class="review"><span class="label">Review</span>${misses.map(m => `
      <div class="miss">
        ${m.it.img ? `<img src="${m.it.img}" alt="Road sign">` : ""}
        <span class="q">${esc(m.it.q)}</span>
        <span class="a">✓ ${esc(m.it.a)}</span>
        <span class="y">✗ You chose: ${esc(m.picked)}</span>
        ${m.it.why ? `<span class="foot">${esc(m.it.why)}</span>` : ""}
      </div>`).join("")}</section>` : ""}`;
  app.querySelector("#quit").onclick = goHome;
  app.querySelector("#again").onclick = () => misses.length
    ? start("Missed questions", shuffle(misses.map(m => m.it)), false)
    : start("Smart drill", pickSmart(items, 15), false);
  window.scrollTo(0, 0);
}

home();
</script>
</body>
</html>
