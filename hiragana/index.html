<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moved to Yomikana</title>
<link rel="canonical" href="https://sarefo.github.io/yomikana/">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="3; url=/yomikana/">
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         display: grid; place-items: center; min-height: 100dvh; margin: 0;
         background: #fafaf8; color: #17171c; text-align: center; padding: 1rem; }
  @media (prefers-color-scheme: dark) { body { background: #131317; color: #ededef; } }
  a { color: #4361b2; }
  @media (prefers-color-scheme: dark) { a { color: #8fa7e8; } }
</style>
</head>
<body>
<div>
  <p>This app moved and is now called <strong>Yomikana</strong>.<br>Your progress came with it.</p>
  <p><a href="/yomikana/">Continue to /yomikana/</a></p>
</div>
<script>
// An installed copy of the old app has a service worker parked on this scope
// that would otherwise keep serving its cache forever. Retire it, drop the
// caches it owned, then move on — progress lives in localStorage, which is
// per-origin and so is already waiting at the new address.
(async () => {
  try {
    if ("serviceWorker" in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.filter(r => r.scope.includes("/hiragana/")).map(r => r.unregister()));
    }
    if ("caches" in window) {
      const keys = await caches.keys();
      await Promise.all(keys.filter(k => k.startsWith("hiragana-")).map(k => caches.delete(k)));
    }
  } catch (e) { /* the redirect matters more than the cleanup */ }
  location.replace("/yomikana/");
})();
</script>
</body>
</html>
